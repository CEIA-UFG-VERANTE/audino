worker_processes auto;

events {
    worker_connections 8000;
    multi_accept on;
}

http {
    server_tokens off;

    gzip on;
    gunzip on;
    gzip_http_version 1.0;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;

    gzip_types
    text/plain
    text/css
    text/js
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    audio/x-wav;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name ceia.cargacheia.com.br evolution-ceia.cargacheia.com.br webhook-ceia.cargacheia.com.br;
        # Habilitar junto se optarem pelo subdominio do Langfuse (ver server block
        # comentado mais abaixo): langfuse-ceia.cargacheia.com.br
        # Redireciona todo o tráfego HTTP para HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name ceia.cargacheia.com.br;
        charset utf-8;
        client_max_body_size 1024m;

        # Mapeamento dos Certificados do Docker Volume
        ssl_certificate /etc/nginx/certs/fullchain1.pem;
        ssl_certificate_key /etc/nginx/certs/privkey1.pem;

        # Otimizações de Segurança SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        root /var/www/html;
        index index.html index.htm;

        location ^~ /langfuse/ {
            # Langfuse (observabilidade dos agentes) publicado no host, porta 3001
            proxy_pass http://host.docker.internal:3001/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_read_timeout 300;

            # Suporte a WebSocket / streaming (UI do Langfuse)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }

        # ---------------------------------------------------------------------
        # ALTERNATIVA RECOMENDADA: Langfuse em subdominio dedicado.
        # O Langfuse (Next.js) nao suporta oficialmente ser servido em subpath,
        # entao o roteamento por /langfuse/ acima pode quebrar assets e rotas
        # internas da UI. O caminho suportado e publicar em subdominio proprio.
        # Exige DNS (langfuse-ceia.cargacheia.com.br) + certificado proprios.
        # ATENCAO: ao habilitar, MOVA este server block para FORA do server { }
        # do dominio principal (junto dos blocos evolution-ceia/webhook-ceia)
        # e habilite tambem o server_name comentado no redirect HTTP -> HTTPS.
        #
        # # Langfuse (observabilidade dos agentes) no subdominio dedicado, porta 3001
        # server {
        #     listen 443 ssl;
        #     server_name langfuse-ceia.cargacheia.com.br;
        #     charset utf-8;
        #     client_max_body_size 1024m;
        #
        #     ssl_certificate /etc/nginx/certs/langfuse/fullchain1.pem;
        #     ssl_certificate_key /etc/nginx/certs/langfuse/privkey1.pem;
        #
        #     ssl_protocols TLSv1.2 TLSv1.3;
        #     ssl_ciphers HIGH:!aNULL:!MD5;
        #
        #     location / {
        #         proxy_pass http://host.docker.internal:3001/;
        #         proxy_set_header Host $host;
        #         proxy_set_header X-Real-IP $remote_addr;
        #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #         proxy_set_header X-Forwarded-Proto $scheme;
        #         proxy_redirect off;
        #         proxy_read_timeout 300;
        #
        #         # Suporte a WebSocket / streaming
        #         proxy_http_version 1.1;
        #         proxy_set_header Upgrade $http_upgrade;
        #         proxy_set_header Connection "upgrade";
        #         proxy_cache_bypass $http_upgrade;
        #         proxy_buffering off;
        #     }
        # }
        # ---------------------------------------------------------------------

        location / {
            try_files $uri $uri/ /index.html;
        }

        # location /api/ {
        #     proxy_pass http://backend:5000/api/;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header Host $host;
        #     proxy_redirect off;
        #     proxy_read_timeout 300;
        # }

        # location /auth/ {
        #     proxy_pass http://backend:5000/auth/;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header Host $host;
        #     proxy_redirect off;
        #     proxy_read_timeout 300;
        # }

        # location /audios/ {
        #     proxy_pass http://backend:5000/audios/;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header Host $host;
        #     proxy_redirect off;
        #     proxy_read_timeout 300;
        # }

        location /agents/ {
            # AgentOS (app separado) publicado no host, porta 8000
            proxy_pass http://host.docker.internal:8000/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_read_timeout 300;

            # Suporte a WebSocket / streaming (respostas de agentes)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }

        location ^~ /evolution/ {
            # Evolution API rodando na maquina host, porta 8080 (stack do Portainer)
            proxy_pass http://host.docker.internal:8080/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_read_timeout 300;

            # Suporte a WebSocket (eventos em tempo real do Evolution)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }

        location ~* ^.+\.(?:css|cur|js|jpe?g|gif|htc|ico|png|html|xml|otf|ttf|eot|woff|woff2|svg)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control public;

            tcp_nodelay off;

            open_file_cache max=3000 inactive=120s;
            open_file_cache_valid 45s;
            open_file_cache_min_uses 2;
            open_file_cache_errors off;
        }
    }

    # Evolution API + Manager no subdominio dedicado (servido na raiz)
    server {
        listen 443 ssl;
        server_name evolution-ceia.cargacheia.com.br;
        charset utf-8;
        client_max_body_size 1024m;

        ssl_certificate /etc/nginx/certs/evolution/fullchain1.pem;
        ssl_certificate_key /etc/nginx/certs/evolution/privkey1.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://host.docker.internal:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 300;

            # Suporte a WebSocket (eventos em tempo real do Evolution)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }
    }

    # Webhook (gateway WhatsApp, app separado) no subdominio dedicado, porta 3000
    server {
        listen 443 ssl;
        server_name webhook-ceia.cargacheia.com.br;
        charset utf-8;
        client_max_body_size 1024m;

        ssl_certificate /etc/nginx/certs/webhook/fullchain1.pem;
        ssl_certificate_key /etc/nginx/certs/webhook/privkey1.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://host.docker.internal:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 300;

            # Suporte a WebSocket / streaming
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }
    }
}
